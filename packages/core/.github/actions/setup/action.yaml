name: Set up core-components
description: >
    Prepare the workspace layout the `link:../store` dependency needs: `core/` next to a built `store/`.
    Check core-components out into `core/` before this action. Remove the store steps once core uses the
    published `@flippo-software/store`.

inputs:
    registry-url:
        description: npm registry to configure (needed only for publishing)
        required: false
        default: ''
    token:
        description: Token able to read the FlippoSoftware/store repository
        required: false
        default: ${{ github.token }}

runs:
    using: composite
    steps:
        - name: Check out store
          uses: actions/checkout@v4
          with:
              repository: FlippoSoftware/store
              path: store
              token: ${{ inputs.token }}

        - name: Install pnpm
          uses: pnpm/action-setup@v4
          with:
              package_json_file: core/package.json

        - name: Install Node.js
          uses: actions/setup-node@v4
          with:
              node-version-file: core/.nvmrc
              registry-url: ${{ inputs.registry-url }}
              cache: pnpm
              cache-dependency-path: |
                  core/pnpm-lock.yaml
                  store/pnpm-lock.yaml

        # The linked store resolves from its `dist/`, so it is built first.
        - name: Build store
          shell: bash
          working-directory: store
          run: pnpm install --frozen-lockfile && pnpm build

        - name: Install dependencies
          shell: bash
          working-directory: core
          run: pnpm install --frozen-lockfile
