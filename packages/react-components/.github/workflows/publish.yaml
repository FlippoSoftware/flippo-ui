name: Release

on:
    push:
        branches:
            - main

permissions:
    contents: write
    pull-requests: write

jobs:
    test:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: headless-components
        steps:
            - uses: actions/checkout@v4
              with:
                  path: headless-components

            - name: Set up
              uses: ./headless-components/.github/actions/setup

            - name: Test
              run: pnpm test

    release-please:
        needs: test
        runs-on: ubuntu-latest
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
        steps:
            - name: Create/update release PR, or tag a release
              id: release
              uses: googleapis/release-please-action@v4
              with:
                  token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

    publish:
        needs: release-please
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        defaults:
            run:
                working-directory: headless-components
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ needs.release-please.outputs.tag_name }}
                  path: headless-components

            # pnpm publishes `link:` specifiers as they are, which consumers can't install.
            - name: Refuse local dependencies
              run: |
                  if grep -n '"link:' package.json; then
                      echo "::error::package.json has link: dependencies; publish them to npm and use versions first."
                      exit 1
                  fi

            - name: Set up
              uses: ./headless-components/.github/actions/setup
              with:
                  registry-url: https://registry.npmjs.org

            - name: Build package
              run: pnpm build

            - name: Publish package
              run: pnpm publish --no-git-checks
