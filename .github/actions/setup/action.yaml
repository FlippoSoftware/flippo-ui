name: Set up the workspace
description: pnpm and Node (with the pnpm store cached), then the dependencies of the whole workspace.

inputs:
    registry-url:
        description: npm registry to publish to (writes the .npmrc used by `pnpm publish`).
        required: false
        default: ''

runs:
    using: composite
    steps:
        # The version comes from `packageManager` in the root package.json.
        - uses: pnpm/action-setup@v4

        - uses: actions/setup-node@v4
          with:
              node-version-file: .nvmrc
              cache: pnpm
              registry-url: ${{ inputs.registry-url }}

        - name: Install
          shell: bash
          run: pnpm install --frozen-lockfile
