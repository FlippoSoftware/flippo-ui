name: Check

on:
    pull_request:
    push:
        branches:
            - main

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile

            # Dependencies first: the packages lint and typecheck against the built workspace packages.
            - name: Build
              run: pnpm build

            - name: Lint
              run: pnpm lint:check

            - name: Typecheck
              run: pnpm typecheck

            - name: Test
              run: pnpm test
