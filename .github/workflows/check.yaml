name: Check

# Builds the workspace once, then lints, typechecks and tests it in parallel against that build. Pull requests run it;
# the release workflow calls it (`workflow_call`) and publishes only when it passes.

on:
    pull_request:
    workflow_call:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: ./.github/actions/setup

            # Dependencies first: the packages are linted, typechecked and tested against the built workspace packages.
            - name: Build
              run: pnpm build

            - name: Keep the build
              uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: packages/*/dist
                  if-no-files-found: error
                  retention-days: 1

    verify:
        needs: build
        runs-on: ubuntu-latest
        strategy:
            # Every check reports, even when another one fails.
            fail-fast: false
            matrix:
                task: [lint:check, typecheck, test]
        name: ${{ matrix.task }}
        steps:
            - uses: actions/checkout@v4

            - uses: ./.github/actions/setup

            - name: Get the build
              uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: packages

            - name: Run ${{ matrix.task }}
              run: pnpm ${{ matrix.task }}
