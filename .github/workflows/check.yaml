name: Check

on:
    pull_request:
        branches:
            - main

jobs:
    check:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: headless-components
        steps:
            - uses: actions/checkout@v4
              with:
                  path: headless-components
                  # `biome ci --changed` compares with the base branch.
                  fetch-depth: 0

            - name: Set up
              uses: ./headless-components/.github/actions/setup

            # Only files changed by the pull request: the rest of the code base still has lint debt.
            - name: Check formatting & linting
              run: pnpm lint:changed --since=origin/${{ github.base_ref }}

            - name: Typecheck
              run: pnpm typecheck

            - name: Build
              run: pnpm build

    test:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: headless-components
        steps:
            - uses: actions/checkout@v4
              with:
                  path: headless-components

            - name: Set up
              uses: ./headless-components/.github/actions/setup

            - name: Test
              run: pnpm test
