name: Release

on:
    push:
        branches:
            - main

    
permissions:
    contents: write
    pull-requests: write


jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  path: core

            - name: Set up
              uses: ./core/.github/actions/setup

            - name: Run tests
              working-directory: core
              run: pnpm test

    release-please:
        runs-on: ubuntu-latest
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
        steps:
            - name: Create/update release PR, or tag a release
              id: release
              uses: googleapis/release-please-action@v4
              with:
                  token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

    publish:
        needs: release-please
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ needs.release-please.outputs.tag_name }}
                  path: core

            # A published package must not point to local folders.
            - name: Refuse local dependencies
              working-directory: core
              run: |
                  if grep -q '"link:' package.json; then
                      echo 'package.json has link: dependencies; switch them to published versions before releasing.'
                      exit 1
                  fi

            - name: Set up
              uses: ./core/.github/actions/setup
              with:
                  registry-url: "https://registry.npmjs.org"

            - name: Build package
              working-directory: core
              run: pnpm build

            - name: Publish package
              working-directory: core
              run: pnpm publish --no-git-checks
