name: Release

# On each push to main: the checks first (build, then lint, typecheck and tests in parallel). When they pass,
# release-please keeps one release pull request per package up to date (its next version, from the releasable
# conventional commits under its folder, and its CHANGELOG). Merging one tags that package, creates its GitHub release
# and publishes it, from the build the checks verified; the other packages wait for their own pull requests.
#
# Maintenance branches (`maintenance/<component>-v<major>`, created from the tag of the last release of an old major)
# work the same way: the release pull request targets the branch and the fixes are published under `v<major>`, not
# `latest`. Prereleases (`2.0.0-beta.1`) are published under their identifier (`beta`), see `tools/dist-tag.ts`.

on:
    push:
        branches:
            - main
            - maintenance/**

permissions:
    contents: read

jobs:
    check:
        uses: ./.github/workflows/check.yaml

    release-please:
        needs: check
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        outputs:
            releases_created: ${{ steps.release.outputs.releases_created }}
            paths_released: ${{ steps.release.outputs.paths_released }}
        steps:
            - name: Create/update the release pull request, or tag the releases
              id: release
              uses: googleapis/release-please-action@v4
              with:
                  # A personal token, so that the release pull request runs the checks (GITHUB_TOKEN does not).
                  token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json
                  # The pushed branch: `main`, or a maintenance branch with its own release pull request.
                  target-branch: ${{ github.ref_name }}

    publish:
        needs: release-please
        if: ${{ needs.release-please.outputs.releases_created == 'true' }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # npm trusted publishing (OIDC): no npm token in the secrets.
            id-token: write
        steps:
            - uses: actions/checkout@v4

            - uses: ./.github/actions/setup
              with:
                  registry-url: https://registry.npmjs.org

            # The build the checks of this run verified (same commit: release-please tags the pushed commit).
            - name: Get the build
              uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: packages

            # Only the released packages; `workspace:^` ranges become the versions of their dependencies. Dependencies
            # first; a dependency that is neither on npm nor released by this run stops the publication
            # (`tools/release-order.ts`). The dist-tag comes from the version and the branch: `latest`, a prerelease
            # identifier (`beta`) or `v<major>`.
            - name: Publish the released packages
              env:
                  PATHS: ${{ needs.release-please.outputs.paths_released }}
                  BRANCH: ${{ github.ref_name }}
              run: |
                  order=$(node tools/release-order.ts "$PATHS")
                  for path in $order; do
                      version=$(jq -r .version "$path/package.json")
                      tag=$(node tools/dist-tag.ts "$version" "$BRANCH")
                      echo "Publishing $path@$version under $tag"
                      pnpm --filter "./$path" publish --no-git-checks --access public --tag "$tag"
                  done
