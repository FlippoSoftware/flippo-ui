name: Release

# On each push to main: the checks first (build, then lint, typecheck and tests in parallel). When they pass,
# release-please keeps one release pull request up to date (the next version of every package with releasable
# conventional commits under its folder, and its CHANGELOG). Merging that pull request tags the released packages,
# creates their GitHub releases and publishes them, from the build the checks verified.

on:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    check:
        uses: ./.github/workflows/check.yaml

    release-please:
        needs: check
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        outputs:
            releases_created: ${{ steps.release.outputs.releases_created }}
            paths_released: ${{ steps.release.outputs.paths_released }}
        steps:
            - name: Create/update the release pull request, or tag the releases
              id: release
              uses: googleapis/release-please-action@v4
              with:
                  # A personal token, so that the release pull request runs the checks (GITHUB_TOKEN does not).
                  token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

    publish:
        needs: release-please
        if: ${{ needs.release-please.outputs.releases_created == 'true' }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # npm trusted publishing (OIDC): no npm token in the secrets.
            id-token: write
        steps:
            - uses: actions/checkout@v4

            - uses: ./.github/actions/setup
              with:
                  registry-url: https://registry.npmjs.org

            # The build the checks of this run verified (same commit: release-please tags the pushed commit).
            - name: Get the build
              uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: packages

            # Only the released packages; `workspace:^` ranges become the versions of their dependencies.
            - name: Publish the released packages
              env:
                  PATHS: ${{ needs.release-please.outputs.paths_released }}
              run: |
                  for path in $(echo "$PATHS" | jq -r '.[]'); do
                      echo "Publishing $path"
                      pnpm --filter "./$path" publish --no-git-checks --access public
                  done
