name: Lint commit messages

# release-please reads the commits: their type sets the bump (fix → patch, feat → minor, `!` → major; before 1.0,
# a breaking change is a minor) and the folder they touch sets the package.

on:
    pull_request:

permissions:
    contents: read
    pull-requests: write

jobs:
    commitlint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: wagoid/commitlint-github-action@v6
              with:
                  configFile: commitlint.config.mjs
